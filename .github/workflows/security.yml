name: LeaveLine DevSecOps Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    name: Automated Security Testing & Quality Gate
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python Environment
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install Dependencies
      - name: Install Application & Scanner Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit pytest requests pyotp

      # 4. Prepare Reports Directory
      - name: Initialize Reports Directory
        run: mkdir -p reports

      # 5. Static Code Analysis (Bandit)
      - name: Run Bandit Security Scanner
        run: |
          echo "[+] Running Bandit AST static analysis..."
          bandit -r app.py -f json -o reports/bandit.json --exit-zero

      # 6. Static Code Analysis (Semgrep + Custom Rules)
      - name: Run Semgrep Security Scanner (Flask + Custom Rules)
        run: |
          echo "[+] Running Semgrep static code analysis..."
          semgrep scan --config "p/python" --config "p/flask" --config ".semgrep/" app.py --json -o reports/semgrep.json || true

      # 7. Software Supply Chain Vulnerabilities (pip-audit)
      - name: Run pip-audit Dependency Vulnerability Scanner
        run: |
          echo "[+] Running pip-audit on dependencies..."
          pip-audit -r requirements.txt -f json -o reports/pip-audit.json || true

      # 8. Secret Detection (Gitleaks)
      - name: Run Gitleaks Secret Scanner
        run: |
          echo "[+] Installing and running Gitleaks secret scanner..."
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks dir . --report-format json --report-path reports/gitleaks.json --exit-code 0 || true

      # 9. Day 6 API Security Test Suite
      - name: Run Day 6 API Security Tests
        run: |
          echo "[+] Running Day 6 API security test suite..."
          pytest tests/test_api.py -v

      # 10. Start Application Server for DAST
      - name: Start LeaveLine Application on Port 5050
        run: |
          echo "[+] Starting background LeaveLine Flask application..."
          python3 app.py &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV

          # Bounded readiness loop (30s)
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5050/login > /dev/null; then
              echo "[+] LeaveLine application is active and ready on http://127.0.0.1:5050"
              break
            fi
            sleep 1
          done

      # 11. Run OWASP ZAP Baseline DAST Scan
      - name: Run OWASP ZAP Baseline DAST Scan
        run: |
          echo "[+] Running OWASP ZAP Baseline DAST scan against http://127.0.0.1:5050..."
          docker run --rm --net="host" -v $(pwd)/reports:/zap/wrk/:rw zaproxy/zap-stable zap-baseline.py \
            -t http://127.0.0.1:5050/ -J zap.json -m 2 -I || true
          if [ ! -f reports/zap.json ]; then
            echo '{"site": []}' > reports/zap.json
          fi

      # 12. Run Day 10 Leave Anomaly Auditor
      - name: Run Day 10 Leave Anomaly Auditor
        run: |
          echo "[+] Running Leave Anomaly Auditor against leave.db..."
          python3 tools/leave_auditor.py --db leave.db -o reports/leave_audit.json || true

      # 13. Guaranteed Server Shutdown
      - name: Shutdown Background LeaveLine Server
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            echo "[+] Stopping LeaveLine application process $APP_PID..."
            kill $APP_PID 2>/dev/null || true
          fi

      # 14. Consolidated Security Quality Gate
      - name: Evaluate Security Quality Gate (--fail-on P1)
        run: |
          echo "[+] Evaluating Consolidated DevSecOps Security Quality Gate..."
          python3 tools/report_parser.py \
            --bandit reports/bandit.json \
            --semgrep reports/semgrep.json \
            --pip-audit reports/pip-audit.json \
            --gitleaks reports/gitleaks.json \
            --zap reports/zap.json \
            --auditor reports/leave_audit.json \
            --fail-on P1 \
            --output-csv plan.csv

      # 15. Record Historical Trend
      - name: Update Historical Trend Progression (trend.csv)
        if: always()
        run: |
          echo "[+] Recording commit in trend.csv..."
          python3 tools/trend.py "${{ github.sha }}" plan.csv trend.csv

      # 16. Upload Security Artifacts
      - name: Upload Security Reports & Trend Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaveline-security-artifacts
          path: |
            reports/
            plan.csv
            trend.csv
          retention-days: 90
