{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:380px;margin:40px auto;text-align:center;">
  <h2>Two-Factor Verification</h2>
  <p class="muted">Enter the 6-digit verification code from your authenticator app to proceed.</p>
  
  {% if error %}<p class="err" style="text-align:left;background:#fde8e8;padding:8px 12px;border-radius:4px;">{{ error }}</p>{% endif %}

  <form method="post" style="text-align:left;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Authentication Code</label>
    <input name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus style="text-align:center;font-size:22px;letter-spacing:6px;font-weight:bold;margin-bottom:12px;">
    <button style="width:100%;padding:10px;font-size:15px;">Verify Code</button>
  </form>
  <p style="margin-top:16px;"><a href="/logout" style="color:#64748b;font-size:13px;text-decoration:none;">&larr; Cancel and return to login</a></p>
</div>
{% endblock %}
