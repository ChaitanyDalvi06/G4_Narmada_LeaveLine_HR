{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:380px;margin:40px auto">
<h2>Sign in</h2>
{% if error %}<p class="err" style="background:#fde8e8;padding:8px 12px;border-radius:4px;">{{ error }}</p>{% endif %}
{% if request.args.get('expired') %}<p class="err" style="background:#fef3c7;color:#92400e;padding:8px 12px;border-radius:4px;">Session timed out due to inactivity. Please sign in again.</p>{% endif %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username</label><input name="username" required autocomplete="username" autofocus>
<label>Password</label><input name="password" type="password" required autocomplete="current-password">
<button style="width:100%;margin-top:8px;">Login</button></form>
<p class="muted" style="margin-top:16px;">New joiner? HR creates your account on your first day.</p>
</div>{% endblock %}
