<!doctype html>
<html><head><meta charset="utf-8"><title>LeaveLine &middot; Narmada Polymers</title>
<style>
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#f2f6f9;color:#16252f}
header{background:#155e75;color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;margin-left:16px}
main{max-width:1000px;margin:28px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;padding:20px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #dfe8ee;vertical-align:top}
input,select,textarea{padding:7px;margin:4px 0 10px;width:100%;box-sizing:border-box;border:1px solid #c3d2dc;border-radius:4px}
button{background:#155e75;color:#fff;border:0;padding:9px 18px;border-radius:4px;cursor:pointer}
.btn-sm{padding:5px 12px;font-size:13px}.grey{background:#7b8a94}
.err{color:#b3261e}.muted{color:#64748b;font-size:13px}
.bal{display:flex;gap:16px}.bal div{flex:1;background:#ecf4f7;border-radius:6px;padding:12px;text-align:center}
.bal b{display:block;font-size:24px}
.row{display:flex;gap:12px}.row>div{flex:1}
.Approved{color:#1b7f3b;font-weight:600}.Pending{color:#b26a00;font-weight:600}.Rejected{color:#b3261e;font-weight:600}
</style></head><body>
<header><strong>Narmada Polymers &middot; LeaveLine</strong>
<span>{% if user %}{{ user.name }} ({{ user.role }}){% if user.role != 'employee' %}<a href="/employee">My leave</a><a href="/">Dashboard</a>{% endif %}<a href="/logout">Logout</a>{% endif %}</span></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
